<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Forms and A11y</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <h1 class="title">Understanding A11y in Forms</h1>
    <form for="title">
      <fieldset>
        <legend>Enter your information</legend>
        <p id="description">
      Please let us know how we can support you with a11y issues.
    </p>

        <label for="input-name">Name:</label>
        <input name="form-name" id="input-name" type="text" required maxlength="20"/>

        <label for="input-age">Age:</label>
        <input name="form-age" id="input-age" type="date" required/>

        <label for="input-color" >Color you cannot see:</label>
        <input name="form-color" id="input-color" type="color" required/>

        <label for="input-text">Message</label>
        <textarea name="form-text" id="input-text" rows="7" placeholder="Leave us a message..."></textarea>
        <button type="submit">Submit</button>
      </fieldset>
    </form>
  </body>
</html>
