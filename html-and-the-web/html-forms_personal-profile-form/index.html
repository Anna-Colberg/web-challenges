<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Personal Profile Form</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  
  <body>
    <h1>Create your Personal Profile</h1>
<form>
    <p>
      We want to get to know you!
      Please enter your personal information:
    </p>

  <fieldset>
    <legend>Personal Information</legend>
  
<label for="input-firstname">First Name</label>
<input name="form-firstname" id="input-firstname" type="text" required>

<label for="input-lastname">Last Name</label>
<input name="form-lastname" id="input-lastname" type="text" required>

<label for="input-birthday">Your Birthday</label>
<input id="input-birthday" type="date" required>
</fieldset>

<p>
  Can you tell us a little bit more?
  We want to annoy you with unwanted ads.
</p>

  <fieldset>
    <legend>Further Information</legend>
<label for="input.color">Favourite Color:</label>
<input type="color">

<label for="select-pets">Whats your Favourite Pet:</label>
<select name="select-pets" id="select-pets">
  <option value="none">--please choose an option--</option>
  <option value="one">Dog</option>
  <option value="two">Cat</option>
  <option value="three">Mouse</option>
  <option value="four">Bird</option>
  <option value="five">other pets</option>
</select>
</fieldset>
<button type="submit" >Submit</button>
</form>
</body>
</html>
